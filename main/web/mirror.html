<!DOCTYPE html>
<!-- RDM-7 Live Mirror — renders the dash on a PC at full frame rate.
     The LVGL WASM engine is served FROM THE DEVICE (/mirror/index.js +
     /mirror/index.wasm, installed once onto LittleFS), so this works in
     hotspot mode with no internet. Live values come from polling
     /api/signals/values; the PC does all rendering, the dash only serves
     small JSON. /api/screenshot remains the pixel-true fallback. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDM-7 Live Mirror</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;color:#99a;font:12px system-ui,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0 0 28px 0;display:flex;align-items:center;justify-content:center}
  #canvas{background:#000;box-shadow:0 0 40px rgba(0,0,0,.8);transform-origin:center center}
  #bar{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;gap:14px;
       padding:0 12px;background:#111;border-top:1px solid #222;white-space:nowrap;overflow:hidden}
  #bar b{color:#ddd;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block;margin-right:5px;vertical-align:-1px}
  .dot.ok{background:#4caf50}.dot.err{background:#e53935}
  #install{max-width:560px;line-height:1.5;color:#bbc}
  #install code{background:#1a1a1a;padding:1px 5px;border-radius:3px;color:#8fd}
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" width="800" height="480"></canvas></div>
<div id="bar">
  <span><span class="dot" id="dot"></span><b>RDM-7 Live Mirror</b></span>
  <span id="status">loading engine…</span>
  <span id="meta"></span>
</div>
<script src="/mirror/index.js"></script>
<script>
"use strict";
(async () => {
  const $ = id => document.getElementById(id);
  const setStatus = (t, ok) => {
    $('status').textContent = t;
    $('dot').className = 'dot' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  };

  /* Fit the fixed 800x480 canvas to the window (CSS scale only — the WASM
   * keeps rendering at native resolution, so it stays crisp downscaled). */
  const fit = () => {
    const s = Math.min(innerWidth / 800, (innerHeight - 28) / 480);
    $('canvas').style.transform = 'scale(' + Math.max(0.1, s) + ')';
  };
  addEventListener('resize', fit); fit();

  if (typeof LVGLPreview !== 'function') {
    /* /mirror/index.js 404'd — engine not on LittleFS yet. */
    $('stage').innerHTML = '<div id="install"><h3 style="color:#ddd">Mirror engine not installed</h3>' +
      'The live mirror renders in your browser using the dash\'s LVGL engine compiled to WebAssembly. ' +
      'The engine (~850&nbsp;KB) lives on the device\'s storage and survives firmware updates, but has to be ' +
      'installed once over WiFi:<br><br><code>tools/install_mirror.ps1 -DeviceIp ' + location.hostname + '</code>' +
      '<br><br>from the firmware repo (artifacts come from the rdm7-wasm-editor build).</div>';
    setStatus('engine not installed', false);
    return;
  }

  let M;
  try {
    M = await LVGLPreview({ canvas: $('canvas'), locateFile: p => '/mirror/' + p });
  } catch (e) {
    setStatus('engine failed to start: ' + e, false);
    return;
  }

  const pushBytes = (fn, name, u8) => {
    const ptr = M._malloc(u8.length);
    if (!ptr) return;
    M.HEAPU8.set(u8, ptr);
    M.ccall(fn, null, ['string', 'number', 'number'], [name, ptr, u8.length]);
    M._free(ptr);
  };
  const fetchOk = async url => {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(url + ' -> ' + r.status);
    return r;
  };

  /* Device fonts -> WASM font manager, so text renders with the exact TTFs
   * the panel uses (tiny_ttf synthesizes any size, same as firmware). */
  setStatus('loading fonts…');
  try {
    const fams = await (await fetchOk('/api/font/list')).json();
    for (const fam of (Array.isArray(fams) ? fams : (fams.fonts || []))) {
      try {
        pushBytes('register_font', fam,
          new Uint8Array(await (await fetchOk('/api/font/data?name=' + encodeURIComponent(fam))).arrayBuffer()));
      } catch (e) { console.warn('font', fam, e); }
    }
  } catch (e) { console.warn('font list', e); }

  /* Device images (RDMIMG) -> WASM MEMFS for image widgets. */
  setStatus('loading images…');
  try {
    const il = await (await fetchOk('/api/image/list')).json();
    for (const img of (il.images || [])) {
      const nm = (img.name || '').replace(/\.rdmimg$/i, '');
      if (!nm) continue;
      try {
        pushBytes('register_image', nm,
          new Uint8Array(await (await fetchOk('/api/image/data?name=' + encodeURIComponent(nm))).arrayBuffer()));
      } catch (e) { console.warn('image', nm, e); }
    }
  } catch (e) { console.warn('image list', e); }

  /* Active layout — same JSON the panel renders, but with the live signal
   * set spliced in. ADR-0005: device layouts no longer carry signals[]
   * decode (it lives in channels.json, device-local), so loading the raw
   * layout into the WASM registers ZERO signals — and inject_signal() is a
   * no-op for an unregistered name, leaving every gauge stuck at "--".
   * Register every live signal NAME with inert decode fields — the WASM's
   * _load_signals requires name + can_id + bit_start + bit_length present
   * or it skips the entry, so {name} alone registers nothing. The decode
   * never runs (no CAN bus in the WASM; we inject values directly), so the
   * params are placeholders. Merged ON TOP of whatever metadata entries the
   * layout does carry (gear value_map, fuel cal) so those survive. */
  const loadLayout = async () => {
    const list = await (await fetchOk('/api/layout/list')).json();
    const active = list.active || 'default';
    const layout = await (await fetchOk('/api/layout/raw?name=' + encodeURIComponent(active))).json();
    const signals = Array.isArray(layout.signals) ? layout.signals.slice() : [];
    const idxByName = new Map();
    signals.forEach((s, i) => { if (s && s.name) idxByName.set(s.name, i); });
    const hasDecode = s => typeof s.can_id === 'number' &&
                           typeof s.bit_start === 'number' && typeof s.bit_length === 'number';
    const DECODE = { can_id: 1, bit_start: 0, bit_length: 8, scale: 1, offset: 0 };
    try {
      const sv = await (await fetchOk('/api/signals/values')).json();
      for (const s of (sv.signals || [])) {
        if (!s.name) continue;
        if (idxByName.has(s.name)) {
          /* Already in the layout (e.g. GEAR with its value_map, FUEL_SENDER_V):
           * the WASM gate rejects entries lacking decode, so AUGMENT it with
           * inert decode fields rather than skip — keeps value_map/fuel_cal
           * while making it register. */
          const e = signals[idxByName.get(s.name)];
          if (!hasDecode(e)) Object.assign(e, DECODE, { source: e.source || 'internal' });
        } else {
          signals.push({ name: s.name, source: 'internal', ...DECODE });
          idxByName.set(s.name, signals.length - 1);
        }
      }
    } catch (e) { console.warn('signal registration list', e); }
    layout.signals = signals;

    /* Apply channel zone thresholds to widgets. ADR-0005 strips warn
     * thresholds from widget JSON (they live on the channel, applied at
     * runtime by the device's channel listener), so the WASM — which has no
     * channel_manager — would colour with empty/default thresholds (e.g. a
     * coolant arc that never goes red). Inject the bound channel's
     * low_warn/high_warn into the config-readable fields per widget type so
     * from_json picks them up; the channel value wins when present, matching
     * the device. Zone COLOURS already travel in the layout. (Arc low/high
     * zone-fill and night mode are channel-listener-only / need a WASM
     * rebuild — out of scope here; the redline + bar/panel warns are the
     * common case and are covered.) */
    try {
      const ch = await (await fetchOk('/api/channels')).json();
      const chBySignal = {};
      for (const c of (ch.channels || [])) if (c.signal) chBySignal[c.signal] = c;
      for (const w of (layout.widgets || [])) {
        const cfg = w.config; if (!cfg) continue;
        const c = chBySignal[cfg.signal_name]; if (!c) continue;
        const hasHi = c.high_warn != null, hasLo = c.low_warn != null;
        if (w.type === 'arc' || w.type === 'meter') {
          if (hasHi) { cfg.redline_threshold = c.high_warn; cfg.redline_enabled = true; }
        } else if (w.type === 'bar') {
          if (hasHi) cfg.bar_high = c.high_warn;
          if (hasLo) cfg.bar_low = c.low_warn;
          if (hasHi || hasLo) cfg.bar_alerts_enabled = true;
        } else if (w.type === 'panel') {
          if (hasHi) { cfg.warning_high_threshold = c.high_warn; cfg.warning_high_enabled = true; }
          if (hasLo) { cfg.warning_low_threshold = c.low_warn; cfg.warning_low_enabled = true; }
        }
      }
    } catch (e) { console.warn('channel threshold apply', e); }

    M.ccall('load_layout_json', null, ['string'], [JSON.stringify(layout)]);
    $('meta').textContent = 'layout: ' + active + ' · ' + signals.length + ' signals';
  };
  setStatus('loading layout…');
  try { await loadLayout(); } catch (e) { setStatus('layout load failed: ' + e, false); return; }

  /* Live values via a SELF-PACING loop. The local-WiFi round-trip is
   * ~70 ms, so a fixed setInterval would fire a second request before the
   * first returned — overlapping requests pile up on the dash's single-
   * connection HTTP server and stall. Instead we run exactly ONE request
   * at a time and schedule the next the moment it completes, so the mirror
   * updates as fast as the link physically allows (~12-14 Hz) with no
   * congestion, capped at 30 Hz so a fast link can't outrun the dash.
   *
   * Runs even when the tab is hidden (the WASM render loop is browser-
   * throttled while hidden, but values keep flowing so showing the tab
   * paints the CURRENT state, not a stale frozen frame). */
  const MIN_GAP_MS = 33;        /* ceiling ~30 Hz */
  const ERR_BACKOFF_MS = 500;
  let lastSeen = 0;
  let emaIntervalMs = 100;      /* smoothed update period, for the Hz readout */
  let lastTick = 0;
  const pollValues = async () => {
    const t0 = performance.now();
    let backoff = false;
    try {
      const data = await (await fetchOk('/api/signals/values')).json();
      for (const s of (data.signals || [])) {
        if (s.stale || s.value == null) continue;
        M.ccall('inject_signal', null, ['string', 'number'], [s.name, s.value]);
      }
      lastSeen = Date.now();
      const now = performance.now();
      if (lastTick) emaIntervalMs += 0.2 * ((now - lastTick) - emaIntervalMs);
      lastTick = now;
      setStatus('live · ' + Math.round(1000 / Math.max(1, emaIntervalMs)) + ' Hz', true);
    } catch (e) {
      backoff = true;
      if (Date.now() - lastSeen > 3000) setStatus('connection lost — retrying…', false);
    }
    const elapsed = performance.now() - t0;
    const wait = backoff ? ERR_BACKOFF_MS : Math.max(0, MIN_GAP_MS - elapsed);
    setTimeout(pollValues, wait);
  };
  pollValues();

  /* Layout hot-reload: a save in the web editor bumps the version. */
  let lastVer = null;
  setInterval(async () => {
    try {
      const v = (await (await fetchOk('/api/layout/version')).json()).version;
      if (lastVer == null) { lastVer = v; return; }
      if (v !== lastVer) {
        lastVer = v;
        setStatus('layout changed — reloading…');
        await loadLayout();
      }
    } catch (e) { /* transient — value poll owns the error status */ }
  }, 3000);
})();
</script>
</body>
</html>
